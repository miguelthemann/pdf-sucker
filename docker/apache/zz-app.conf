# Ocultar assinatura do servidor
ServerTokens Prod
ServerSignature Off

# Permitir uploads grandes (o Apache 2.4.54+ limita por omissão a 1 GiB / 1073741824 bytes -> HTTP 413)
# 0 = sem limite ao nível do Apache (o limite é delegado ao PHP post_max_size)
LimitRequestBody 0
Timeout 3600

# Permitir .htaccess (ex.: negar acesso HTTP directo a /uploads)
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>
